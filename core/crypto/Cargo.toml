[package]
name = "familychat-crypto"
version = "0.1.0"
edition = "2021"

[lib]
name = "familychat_crypto"
crate-type = ["rlib", "cdylib"]

[features]
default = []
# TODO: Add libsignal-client bindings once the crypto FFI is implemented.
signal = []

[dependencies]
ffi-support = "0.4"
once_cell = "1.18"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1", features = ["v4"] }
base64 = "0.21"
