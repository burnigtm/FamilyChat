name: familychat
description: Secure, self-hosted messenger for your family.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  drift: ^2.14.1
  path_provider: ^2.1.1
  uuid: ^4.3.1
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2
  livekit_client: ^2.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.7
  freezed: ^2.4.6
  drift_dev: ^2.14.1
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
